service: alignwell-meded-tool

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  
  # Environment variables
  environment:
    AWS_REGION: ${self:provider.region}
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}-doctors
    BEDROCK_MODEL_ID: anthropic.claude-3-sonnet-20240229-v1:0
    CLOUDWATCH_LOG_GROUP: /aws/lambda/${self:service}-${self:provider.stage}
    GOOGLE_CREDENTIALS_FILE: credentials.json
    GOOGLE_TOKEN_FILE: token.json
  
  # IAM permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:CreateTable
            - dynamodb:DescribeTable
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:Query
            - dynamodb:ListTagsOfResource
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-doctors
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}-doctors/index/*
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: '*'
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
        - Effect: Allow
          Action:
            - iam:CreateRole
            - iam:PutRolePolicy
            - iam:AttachRolePolicy
            - iam:PassRole
          Resource: '*'

functions:
  api:
    handler: lambda_handler.lambda_handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

# DynamoDB table
resources:
  Resources:
    DoctorsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}-doctors
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: doctor_id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: doctor_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        SSESpecification:
          SSEEnabled: true
          SSEType: KMS
          KMSMasterKeyId: alias/aws/dynamodb
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Compliance
            Value: HIPAA
          - Key: Application
            Value: AlignWell-MedEd

# CloudWatch Log Group
  AlignWellLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/${self:service}-${self:provider.stage}
      RetentionInDays: 30

# Outputs
outputs:
  ApiGatewayRestApiId:
    Value:
      Ref: ApiGatewayRestApi
    Export:
      Name: ${self:service}-${self:provider.stage}-restApiId

  ApiGatewayRestApiRootResourceId:
    Value:
      Fn::GetAtt:
        - ApiGatewayRestApi
        - RootResourceId
    Export:
      Name: ${self:service}-${self:provider.stage}-rootResourceId

  DynamoDBTableName:
    Value:
      Ref: DoctorsTable
    Export:
      Name: ${self:service}-${self:provider.stage}-doctorsTable

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    strip: false
    noDeps: false
